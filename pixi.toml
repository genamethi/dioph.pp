[workspace]
authors = ["Eric Page <genamthi@gmail.com>"]
channels = ["conda-forge"]
name = "dioph.pp"
platforms = ["linux-64"]
version = "1.3.1"

[tasks]
native-bench-core = "native/build/primeparts-bench-core --start-idx 1 --count 1000000"
native-bench-materialize = "native/build/primeparts-bench-materialize --start-idx 1 --count 1000000 --chunk-primes 500000"
native-generate = "native/build/primeparts-generate --start-idx 1 --count 1000000 --temp --chunk-primes 500000"
native-commit = "PYTHONPATH=src python -m primeparts.native_iceberg"
# Provisioning (system toolchain only; configure writes native/config.mk).
native-configure = "native/configure"
native-build = "make -C native all"
native-test = "make -C native test CC=/usr/bin/gcc CXX=/usr/bin/g++"
completion-zsh = "register-python-argcomplete --shell zsh primeparts"
completion-bash = "register-python-argcomplete --shell bash primeparts"
vendor-patch = "scripts/apply_vendor_patches.sh"

[dependencies]
polars = ">=1.38.1,<2"
python = "==3.14.4"
sagelib = "==10.9"
sage = ">=10.9,<11"


[tool.funbuns.directories]
data_dir = "/media/extssd/research/dioph.pp/data"
iceberg_dir = "/media/extssd/research/dioph.pp/data/ib-staging"
log_dir = "logs"

